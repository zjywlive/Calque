<text x="1132" y="89" font-size="13" fill="#9aa4b2" text-anchor="end">paper.pdf  EN → 中文</text>
<line x1="612" y1="106" x2="1160" y2="106" stroke="#30363d"/>
<rect class="hl0" x="640" y="128" width="500" height="30" rx="6" fill="#1d2433"/><text class="en0" x="660" y="148" font-size="17" fill="#9aa4b2">Optical tactile sensors turn contact into images.</text><text class="zh0" x="660" y="148" font-size="19" font-weight="600" fill="#e6edf3">光学触觉传感器把接触变成图像。</text><rect class="hl1" x="640" y="174" width="500" height="30" rx="6" fill="#1d2433"/><text class="en1" x="660" y="194" font-size="17" fill="#9aa4b2">A soft skin deforms against an object.</text><text class="zh1" x="660" y="194" font-size="19" font-weight="600" fill="#e6edf3">柔软的表层贴着物体发生形变。</text><rect class="hl2" x="640" y="220" width="500" height="30" rx="6" fill="#1d2433"/><text class="en2" x="660" y="240" font-size="17" fill="#9aa4b2">A camera inside records the deformation.</text><text class="zh2" x="660" y="240" font-size="19" font-weight="600" fill="#e6edf3">内部的相机记录下这种形变。</text>
