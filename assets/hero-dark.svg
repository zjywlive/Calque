<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Calque (镜译): layout-preserving document translation, fully offline">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}@keyframes en0{0%,18%{opacity:1}22%,92%{opacity:0}97%,100%{opacity:1}}@keyframes zh0{0%,20%{opacity:0;transform:translateY(6px)}25%,90%{opacity:1;transform:none}95%,100%{opacity:0}}@keyframes hl0{0%,15%{opacity:0}18%{opacity:.9}24%,100%{opacity:0}}@keyframes en1{0%,32%{opacity:1}36%,92%{opacity:0}97%,100%{opacity:1}}@keyframes zh1{0%,34%{opacity:0;transform:translateY(6px)}39%,90%{opacity:1;transform:none}95%,100%{opacity:0}}@keyframes hl1{0%,29%{opacity:0}32%{opacity:.9}38%,100%{opacity:0}}@keyframes en2{0%,46%{opacity:1}50%,92%{opacity:0}97%,100%{opacity:1}}@keyframes zh2{0%,48%{opacity:0;transform:translateY(6px)}53%,90%{opacity:1;transform:none}95%,100%{opacity:0}}@keyframes hl2{0%,43%{opacity:0}46%{opacity:.9}52%,100%{opacity:0}}.en0{animation:en0 9s ease-in-out infinite}.zh0{opacity:0;animation:zh0 9s ease-in-out infinite}.hl0{opacity:0;animation:hl0 9s ease-in-out infinite}.en1{animation:en1 9s ease-in-out infinite}.zh1{opacity:0;animation:zh1 9s ease-in-out infinite}.hl1{opacity:0;animation:hl1 9s ease-in-out infinite}.en2{animation:en2 9s ease-in-out infinite}.zh2{opacity:0;animation:zh2 9s ease-in-out infinite}.hl2{opacity:0;animation:hl2 9s ease-in-out infinite}@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:1}62%{transform:translateY(150px);opacity:1}70%,100%{transform:translateY(150px);opacity:0}}.scan{animation:scan 9s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes done{0%,64%{opacity:0;transform:translateY(4px)}70%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.done{opacity:0;animation:done 9s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.zh0,.zh1,.zh2,.done{opacity:1}.en0,.en1,.en2,.scan{opacity:0}}</style>
<rect width="1200" height="360" rx="20" fill="#0d1117"/>
<text x="64" y="138" font-size="52" font-weight="700" fill="#e6edf3">Calque</text>
